name: Secrets Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out all fetched history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned official Gitleaks executable
        shell: bash
        run: |
          set -euo pipefail
          gitleaks_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$gitleaks_dir" "$RUNNER_TEMP/gitleaks-ignore"
          archive="$gitleaks_dir/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$gitleaks_dir" gitleaks
          printf '%s\n' "$gitleaks_dir" >> "$GITHUB_PATH"

      - name: Verify detection rules with synthetic input
        run: python3 scripts/check_secret_rules.py

      - name: Scan all fetched Git history
        run: >-
          gitleaks git . --config .gitleaks.toml --log-opts="--all --full-history -m"
          --redact=100 --no-banner --no-color --ignore-gitleaks-allow
          --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-ignore"
          --max-decode-depth=2 --max-archive-depth=2 --timeout=480
