title = "WFRMLS credential checks"
minVersion = "v8.30.1"

[extend]
useDefault = true

[[rules]]
id = "wfrmls-bearer-token"
description = "WFRMLS 32-character hexadecimal bearer-token literal"
regex = '''(?i)(?:\b(?:wfrmls_bearer_token|bearer_token)\b[\s'"\]\)]*(?:=|:)[\s'"`]*|\bbearer[ \t]+)([0-9a-f]{32})(?:[^0-9a-f]|$)'''
secretGroup = 1
keywords = ["bearer"]

# Preserve the upstream rule and add only this confirmed record-ID exception.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Exact historical MediaKey record ID in its media-test fixture"
condition = "AND"
paths = ['''(?:^|/)tests/test_media\.py$''']
regexTarget = "secret"
regexes = ['''^123_primary\.jpg$''']
